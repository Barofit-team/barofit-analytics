spring:
  application:
    name: analytics-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://barofit-prod-postgres.czaikwsmwix7.ap-northeast-2.rds.amazonaws.com:5432/barofit}
    username: ${DB_USERNAME:analytics_user}
    password: ${DB_PASSWORD:}
    hikari:
      schema: analytics
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: analytics
  flyway:
    enabled: false
barofit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
  workout:
    base-url: ${WORKOUT_BASE_URL:http://localhost:3006}
  analytics:
    internal-token: ${ANALYTICS_INTERNAL_TOKEN:}

server:
  port: ${ANALYTICS_PORT:3007}
